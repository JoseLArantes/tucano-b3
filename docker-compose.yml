services:
  # Serviço de produção da API REST
  api:
    image: registry.beakcloud.com/tucano-b3-api:latest
    platform: linux/amd64
    container_name: tucano_b3_api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TUCANO_LOG_LEVEL=info
      - TUCANO_LOG_FORMAT=json
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8080/api/v1/health" ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ambiente de desenvolvimento com live-reload (cargo-watch)
  dev:
    profiles: [ dev ]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tucano_b3_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - cargo_target:/workspace/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      - CARGO_HOME=/usr/local/cargo
      - CARGO_TARGET_DIR=/workspace/target
      - TUCANO_LOG_LEVEL=debug
      - TUCANO_LOG_FORMAT=pretty
    working_dir: /workspace
    command: cargo watch -x run

  # Contêiner utilitário para comandos de validação e CI local (fmt, clippy, test, bench)
  cargo:
    profiles: [ tools, dev ]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tucano_b3_cargo
    volumes:
      - .:/workspace
      - cargo_target:/workspace/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    working_dir: /workspace
    environment:
      - CARGO_HOME=/usr/local/cargo
      - CARGO_TARGET_DIR=/workspace/target

volumes:
  cargo_target:
  cargo_registry:
  cargo_git:
