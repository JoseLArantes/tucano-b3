services:
  b3_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tucano_b3_benchmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: benchmark-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tucano_b3_benchmark"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - benchmark_postgres_data:/var/lib/postgresql/data

volumes:
  benchmark_postgres_data:
