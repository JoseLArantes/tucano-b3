[package]
name = "tucano-b3"
version = "0.0.1"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "rust_decimal", "uuid", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
rust_decimal = { version = "1.36", features = ["serde", "db-tokio-postgres"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10" }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
quick-xml = "0.37"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
url = "2.5"
thiserror = "2.0"
anyhow = "1.0"
aws-config = "1"
aws-sdk-s3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tokio-stream = "0.1"
utoipa = { version = "5.3", features = ["chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.16"
aws-credential-types = "1"
tower = { version = "0.5", features = ["util"] }

