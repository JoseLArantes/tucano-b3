[package]
name = "tucano-b3"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "API REST de alta performance para dados de mercado da B3"
license = "MIT"
repository = "https://github.com/tucano-b3/tucano-b3"
documentation = "https://github.com/tucano-b3/tucano-b3"
homepage = "https://github.com/tucano-b3/tucano-b3"
readme = "README.md"
keywords = ["b3", "market-data", "rest-api", "parquet", "datafusion"]
categories = ["web-programming::http-server", "finance"]
exclude = [
    "tests/fixtures/*",
    "benches/*",
    ".github/*",
    "docker/*",
    "contrib/*",
]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-full", "cors", "trace", "request-id", "timeout"] }
hyper = { version = "1.0", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Data layer
datafusion = "42"
arrow = "53"
parquet = "53"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Cache
dashmap = "6"
lru = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.13"

# Config
config = "0.14"
toml = "0.8"

# S3-compatible object storage (Cloudflare R2 and others).
# rusty-s3 0.8 stays on the crate MSRV (Rust 1.81). Newer AWS SDK releases require Rust 1.86+.
rusty-s3 = "=0.8.1"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
blake3 = "1"
zip = "2"
multer = "3"
tempfile = "3"
rayon = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
tokio-test = "0.4"
hyper-util = { version = "0.1", features = ["full"] }

[[bench]]
name = "data_layer"
harness = false

[[bench]]
name = "api"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = 3

