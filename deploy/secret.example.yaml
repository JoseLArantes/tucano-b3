apiVersion: v1
kind: Secret
metadata:
  name: tucano-b3-secret
  namespace: tucano-services
type: Opaque
stringData:
  # Primary API bearer / X-API-Key token (required for protected routes)
  TUCANO_B3_TOKEN: "replace-with-strong-token"

  # Optional additional tokens
  TUCANO_B3_READ_TOKEN: ""
  TUCANO_B3_ADMIN_TOKEN: ""

  # Optional Prometheus scrape bearer (if ServiceMonitor bearerTokenSecret.enabled)
  METRICS_TOKEN: ""

  # S3-compatible object storage (Cloudflare R2). Ingestion runs only on
  # POST /api/v1/ingest/bucket. Endpoint, bucket, region, and prefix are in the ConfigMap.
  TUCANO_S3_ACCESS_KEY_ID: ""
  TUCANO_S3_SECRET_ACCESS_KEY: ""
