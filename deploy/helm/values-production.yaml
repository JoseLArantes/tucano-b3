# Production values for bos-k (nginx Ingress + Istio public-gateway at the edge).
# Keep at 1 while persistence.accessMode is ReadWriteOnce (single-node PVC attach).
replicaCount: 1

image:
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: b3-tucano.beakcloud.com
  # TLS terminates upstream of this Ingress on bos-k (same pattern as tmqa).
  # Dedicated ingest Ingress: nginx default client_max_body_size is 1m and
  # returns 413 for COTAHIST ZIPs (~90 MB). 500m matches the app limit.
  ingest:
    path: /api/v1/ingest
    proxyBodySize: "500m"
    proxyReadTimeout: "600"
    proxySendTimeout: "600"
  tls:
    enabled: false
    secretName: tucano-b3-tls

# cert-manager is not installed on bos-k.
certificate:
  enabled: false
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod

secrets:
  existingSecret: "tucano-b3-secret"

config:
  serverHost: "0.0.0.0"
  serverPort: "8080"
  dataDir: "/data"
  logLevel: "info"
  logFormat: "json"
  cacheEnabled: "true"
  cacheTtl: "300"
  cacheMaxEntries: "10000"
  s3Endpoint: ""
  s3Bucket: ""
  s3Region: "auto"
  s3Prefix: ""
  s3ForcePathStyle: "true"

persistence:
  enabled: true
  size: 50Gi
  accessMode: ReadWriteOnce
  mountPath: /data

vault:
  enabled: true
  role: "tucano-services-role"
  # /v1/bos-secrets/data/tucano-services/production/base
  secretPath: "tucano-services/production/base"
  # ConfigMap in tucano-services. Not stored in git. Same CA as vault-cluster-store.
  caConfigMap: "vault-ca"
  caConfigMapKey: "ca.crt"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
